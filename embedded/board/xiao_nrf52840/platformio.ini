; Seeed XIAO nRF52840 (Cortex-M4F 64 MHz, 256 KB RAM, 1 MB flash), Seeed's Adafruit-based Arduino core, through the
; community nordicnrf52 platform (the official one does not list the XIAO). One environment per model header in
; embedded/generated/ (export_model.py --dims ...): build with  pio run -e <env>,  flash with  pio run -e <env> -t upload.
; The build prints RAM and flash use; tools/replay.py streams a profile and reports the time per step.
; Not listed: 10/6/10 and 10/3/10 at 12 + 2 modes (327 / 324 filter states: the UD covariance alone is ~420 KB).

[platformio]
default_envs = m10_6_10_k31

[env]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -I../../include
    -I../../generated
    -DDFN_DOUBLE=0

[env:m10_6_10_k31]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_10-6-10_m3k1/model.h\"

[env:m10_6_10_k21]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_10-6-10_m2k1/model.h\"

[env:m10_3_10_k31]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_10-3-10_m3k1/model.h\"

[env:m10_3_10_k21]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_10-3-10_m2k1/model.h\"

[env:m5_3_5_k122]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_5-3-5_m12k2/model.h\"

[env:m5_3_5_k31]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_5-3-5_m3k1/model.h\"

[env:m5_3_5_k21]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_5-3-5_m2k1/model.h\"

[env:m3_2_3_k122]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_3-2-3_m12k2/model.h\"

[env:m3_2_3_k31]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_3-2-3_m3k1/model.h\"

[env:m3_2_3_k21]
build_flags = ${env.build_flags} -DDFN_MODEL_HEADER=\"lp604765_T20_3-2-3_m2k1/model.h\"

; 10/6/10, 3 + 1 with the closure in double (soft-float on the M4F): the cost of the precision fallback
[env:m10_6_10_k31_cd]
build_flags = ${env.build_flags} -DDFN_CLOSURE_DOUBLE=1 -DDFN_MODEL_HEADER=\"lp604765_T20_10-6-10_m3k1/model.h\"
