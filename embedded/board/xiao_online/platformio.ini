; Online SOC estimation (src/main.cpp for the telemetry, board.h for the wiring of each board).
;   nrf52840: XIAO nRF52840          pio run -e nrf52840 -t upload --upload-port COMx
;   esp32s3:  any XIAO ESP32-S3 (Battage board or bare)  pio run -e esp32s3 -t upload --upload-port COMx
;             one image for both: the temperature sensor (DHT22 on D10 or KY-013 NTC on D1) is found at run time
; Telemetry: USB serial 115200 and Bluetooth LE (Nordic UART, name MPM-LE EKF), readable by the Battage dashboard.
; Same partition table as the Battage firmware (the board default, default_8MB.csv): its NVS survives, and
; "pio run -t upload" in BattageDiagnosticSystem/Embedded/firmware puts the Battage firmware back.
; I_SELF_A: on the Battage board the XIAO runs from BAT+ on the cell side of the shunt, so its own draw is not
; measured; -DI_SELF_A=<A> adds it to the current once measured (meter in series with BAT+).

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -Os
dfn_flags =
    -std=gnu++17
    -O2
    -I../../include
    -I../../generated
    -DDFN_DOUBLE=0
    -DSTEP_S=5
    -DDFN_MODEL_HEADER=\"lp604765_T20_10-6-10_m3k1_RfLLIVb_CYC20/model.h\"
; model: the paper's set (fit_an_Mohtat2020) and filter (Rf, LLI, voltage bias Vb; 2 h hold; one voltage update per
; 300 s), exported by export_model.py with the arguments in the header's second line

[env:nrf52840]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
; The Adafruit builder compiles with -Ofast, i.e. -ffast-math: NaN is assumed away, the firmware's NaN checks
; (v == v) vanish and formatting the first NaN of a telemetry line was undefined behaviour - the board stopped at its
; first EKF step (2026-11-11). Fast math off.
build_unflags = ${env.build_unflags} -Ofast
build_flags = ${env.dfn_flags} -fno-fast-math
lib_deps =
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14

[env:nrf52840_sensors]               ; wiring check: V, I and T on the screen and the serial port, no EKF
extends = env:nrf52840
build_flags = ${env.dfn_flags} -fno-fast-math -DSENSORS_ONLY

[env:esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
board_build.f_cpu = 240000000L        ; EKF step ~0.15-0.25 s (80 MHz, as the Battage firmware: ~3x slower, less current)
upload_speed = 115200                ; native USB: the default switch to 460800 can fail (as the Battage firmware)
extra_scripts = post:no_stub.py      ; flash with the ROM loader: the esptool stub hangs on this PC
build_flags =
    ${env.dfn_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
